<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Practical development gotchas, fixes, and lessons.">
  <title>Development Field Notes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="/dev-notes/site.css">
</head>
<body>
  <div id="app">Loading Development Field Notes…</div>
  <script>
    window.$docsify = {
      name: 'Development Field Notes',
      repo: 'https://github.com/mitchins/dev-notes',
      // This is a GitHub Pages project site, served from /dev-notes/.
      basePath: '/dev-notes/',
      homepage: 'README.md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      search: {
        paths: 'auto',
        depth: 4,
        maxAge: 86400000,
        placeholder: 'Search notes',
        noData: 'No matching notes',
        hideOtherSidebarContent: false
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
</body>
</html>
